<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ProcWatch — Pause Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14171C;
    --card:#1C2028;
    --card-edge:#262B34;
    --text:#E8EAED;
    --muted:#8B93A1;
    --teal:#4FD1C5;
    --amber:#F2A65A;
    --track:#2A2F38;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  .overlay{
    width:100%;
    max-width:460px;
    background:var(--card);
    border:1px solid var(--card-edge);
    border-radius:14px;
    padding:28px 28px 22px;
    position:relative;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.45);
  }

  /* faint scanline texture to sell the "frozen snapshot" idea */
  .overlay::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
  }

  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(242,166,90,0.18);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.45;}
  }
  .status-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber);
  }

  h1{
    font-size:21px;
    font-weight:600;
    margin:4px 0 2px;
    letter-spacing:-0.01em;
  }
  .subhead{
    color:var(--muted);
    font-size:13px;
    margin:0 0 22px;
  }
  .subhead .mono{color:var(--muted);}

  .total-block{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding-bottom:18px;
    margin-bottom:18px;
    border-bottom:1px solid var(--card-edge);
  }
  .total-value{
    font-size:34px;
    font-weight:600;
    letter-spacing:-0.02em;
  }
  .total-unit{
    color:var(--muted);
    font-size:13px;
  }
  .total-caption{
    margin-left:auto;
    text-align:right;
    color:var(--muted);
    font-size:12px;
    line-height:1.4;
  }

  .rows{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .row{
    display:grid;
    grid-template-columns:22px 1fr auto;
    align-items:center;
    gap:12px;
  }
  .rank{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
  }
  .row:first-child .rank{color:var(--teal);}

  .app-info{
    min-width:0;
  }
  .app-name{
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:6px;
  }

  /* signature element: segmented meter, like a process/CPU gauge */
  .meter{
    height:6px;
    display:flex;
    gap:2px;
    width:100%;
  }
  .seg{
    flex:1;
    background:var(--track);
    border-radius:1px;
  }
  .seg.filled{
    background:var(--teal);
  }
  .row:first-child .seg.filled{
    background:var(--amber);
  }

  .stat{
    text-align:right;
    white-space:nowrap;
  }
  .stat-time{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:500;
  }
  .stat-pct{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:var(--muted);
  }

  .footer{
    margin-top:22px;
    padding-top:16px;
    border-top:1px solid var(--card-edge);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .footer-note{
    font-size:11px;
    color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
  }
  .resume-btn{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;
    font-weight:600;
    color:var(--bg);
    background:var(--teal);
    border:none;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
  }
  .resume-btn:focus-visible{
    outline:2px solid var(--teal);
    outline-offset:2px;
  }
  .resume-btn:hover{
    filter:brightness(1.08);
  }

  @media (prefers-reduced-motion: reduce){
    .dot{animation:none;}
  }
</style>
</head>
<body>

<div class="overlay">
  <div class="status-row">
    <span class="dot"></span>
    <span class="status-label">Tracking paused</span>
  </div>
  <h1>Session snapshot</h1>
  <p class="subhead">Paused at <span class="mono">2:47 PM</span> · today, <span class="mono">Aug 30</span></p>

  <div class="total-block">
    <span class="total-value mono">4h 12m</span>
    <span class="total-unit">tracked</span>
    <span class="total-caption">across<br>7 apps</span>
  </div>

  <div class="rows" id="rows"></div>

  <div class="footer">
    <span class="footer-note">SQLITE · usage_log</span>
    <button class="resume-btn">Resume tracking</button>
  </div>
</div>

<script>
  // Mock data — replace with window.procwatch.getSummary() in the real app
  const data = [
    { app: "Visual Studio Code", seconds: 6120, percent: 40.5 },
    { app: "Chrome", seconds: 4680, percent: 31.0 },
    { app: "Slack", seconds: 1560, percent: 10.3 },
    { app: "Figma", seconds: 900, percent: 6.0 },
    { app: "Spotify", seconds: 780, percent: 5.2 },
    { app: "Terminal", seconds: 540, percent: 3.6 },
    { app: "Notes", seconds: 480, percent: 3.2 },
  ];

  const SEGMENTS = 24;

  function fmtDuration(totalSeconds){
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.round((totalSeconds % 3600) / 60);
    if(h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  const rowsEl = document.getElementById('rows');

  data.forEach((item, i) => {
    const filledCount = Math.max(1, Math.round((item.percent / 100) * SEGMENTS));
    let segsHtml = '';
    for(let s = 0; s < SEGMENTS; s++){
      segsHtml += `<span class="seg ${s < filledCount ? 'filled' : ''}"></span>`;
    }

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="rank mono">${String(i+1).padStart(2,'0')}</span>
      <div class="app-info">
        <div class="app-name">${item.app}</div>
        <div class="meter">${segsHtml}</div>
      </div>
      <div class="stat">
        <div class="stat-time mono">${fmtDuration(item.seconds)}</div>
        <div class="stat-pct mono">${item.percent}%</div>
      </div>
    `;
    rowsEl.appendChild(row);
  });
</script>

</body>
</html>
