name: Release Build

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools icnsutils graphicsmagick xdotool wmctrl x11-utils

      - name: Install all dependencies (npm workspaces)
        run: npm install

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild

      - name: Build frontend production bundle
        run: npm run build:frontend

      - name: Package AppImage and deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.AppImage
            release/*.deb
          draft: false
          prerelease: false
          generate_release_notes: true

      # ── Cloudsmith Publishing ──────────────────────────────────────────

      - name: Setup Cloudsmith CLI
        if: startsWith(github.ref, 'refs/tags/')
        uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${RAW_TAG#v}" >> $GITHUB_OUTPUT

      - name: Publish .deb to Cloudsmith
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          DEB_FILE=$(find release -name '*.deb' | head -1)
          if [ -n "$DEB_FILE" ]; then
            cloudsmith push deb ${{ vars.CLOUDSMITH_OWNER }}/${{ vars.CLOUDSMITH_REPO }}/any-distro/any-version "$DEB_FILE"
          fi

      - name: Publish AppImage to Cloudsmith
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          APPIMAGE_FILE=$(find release -name '*.AppImage' | head -1)
          if [ -n "$APPIMAGE_FILE" ]; then
            cloudsmith push raw ${{ vars.CLOUDSMITH_OWNER }}/${{ vars.CLOUDSMITH_REPO }} "$APPIMAGE_FILE" \
              --name "procwatch" \
              --version "${{ steps.version.outputs.VERSION }}" \
              --summary "ProcWatch AppImage for Linux x64"
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install all dependencies (npm workspaces)
        run: npm install

      - name: Rebuild native dependencies for Electron
        run: npm run rebuild

      - name: Build frontend production bundle
        run: npm run build:frontend

      - name: Package Windows NSIS and Portable Exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
          draft: false
          prerelease: false
